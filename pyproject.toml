[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pceg-kt"
version = "0.1.0"
description = "Prior-Calibrated Energy Gating for Knowledge Tracing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "matplotlib==3.10.1",
  "numpy==2.1.2",
  "pandas==2.2.3",
  "scikit-learn==1.6.1",
  "scipy==1.15.2",
  "torch==2.6.0",
  "tqdm==4.67.1"
]

[tool.setuptools.packages.find]
include = ["pceg*"]
